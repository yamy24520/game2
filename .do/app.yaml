# Configuration DigitalOcean App Platform
name: fiona-site
region: nyc

# Static site (frontend)
static_sites:
  - name: web
    github:
      branch: main
      deploy_on_push: true
    build_command: echo "No build needed"
    output_dir: /
    index_document: index.html
    error_document: index.html
    routes:
      - path: /

# Backend API service
services:
  - name: api
    github:
      branch: main
      deploy_on_push: true
    source_dir: api
    run_command: npm start
    environment_slug: node-js
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 8080
    routes:
      - path: /api
